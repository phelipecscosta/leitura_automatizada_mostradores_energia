# Configuração do pacote do produto e das suas dependências.
# Versões exatas de tudo (inclusive dependências indiretas) ficam no
# arquivo de travamento requirements-lock-cu126.txt.

[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "meter-reader"
version = "0.1.0"  # única fonte da versão do pacote
description = "Leitura automatizada de mostradores de medidores de energia."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Phelipe C. S. Costa" }]
requires-python = ">=3.11,<3.12"

# Dependências diretas do produto, com faixas de versão.
# O torch e o torchvision são instalados antes, do índice do PyTorch,
# porque o build (CPU ou CUDA) depende do índice, e não do nome.
dependencies = [
    "torch>=2.14,<2.15",
    "torchvision>=0.29,<0.30",
    "numpy>=2.4,<3",
    "pandas>=2.2",
    "pillow>=12.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Ferramentas de desenvolvimento: não vão para o instalador do cliente
dev = ["pytest>=8"]
# Dependências do treino (pasta training/): não vão para o instalador do
# cliente nem para a imagem Docker (instruções 6.2)
training = [
    "scikit-learn>=1.6",   # métricas (precisão média) e utilitários de avaliação
    "scikit-image>=0.25",  # HOG da baseline não profunda (D3)
    "scipy>=1.14",         # Laplaciano da baseline (importado diretamente)
    "onnx>=1.17",          # formato da exportação (N4)
    "onnxscript>=0.2",     # exigido pelo exportador ONNX do PyTorch
    "onnxruntime>=1.20",   # motor de CPU para paridade e latência (N4; motor do produto decidido na ET9)
]

[tool.setuptools.packages.find]
where = ["src"]  # layout src/: só o que está em src/ entra no pacote

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # permite importar o pacote training/ nos testes
